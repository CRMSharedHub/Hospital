<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="نظام إدارة المستشفى — المرضى، الأطباء، المواعيد، الفوترة، الصيدلية، المختبر، والتقارير" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Hospital" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <title>نظام إدارة المستشفى</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme')
        var dark =
          stored === 'dark' ||
          (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var lang = localStorage.getItem('lang')
        if (lang === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }
      } catch (e) {
        /* storage unavailable — fall back to markup defaults */
      }
    })()
  </script>
</head>

<body>
  <div id="root"><!--ssr-outlet--></div>
  <script type="module" src="/src/entry-client.tsx"></script>
</body>

</html>
