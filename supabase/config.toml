# Edge Functions config — kept in sync by: npm run ops:sync-config

[functions.medical-files]
verify_jwt = true

# Cron callers use x-cron-secret; admin JWT also allowed inside the function.
[functions.retention-purge]
verify_jwt = false

# Payments: JWT validated inside for create/confirm; Stripe webhook uses signature header.
[functions.payments]
verify_jwt = false

[functions.fhir-r4]
verify_jwt = true

[functions.mllp-ingest]
verify_jwt = true

[functions.nphies]
verify_jwt = true

# IdP SCIM uses Bearer SCIM_TOKEN (validated in function).
[functions.scim]
verify_jwt = false

[functions.kms-unwrap]
verify_jwt = true
